name: Feature request
description: 建议新的能力、控件支持或工作流改进
title: "[Feature] "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 描述具体使用场景、当前限制和用户影响。
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 说明期望行为以及如何处理歧义、失败和人工确认。
    validations:
      required: true

  - type: textarea
    id: privacy
    attributes:
      label: 权限与隐私影响
      description: 如果方案需要新权限、网络服务或保存更多数据，请明确说明。

  - type: checkboxes
    id: boundaries
    attributes:
      label: 项目边界
      options:
        - label: 我理解 ApplyKit 不自动上传附件、确认声明、处理验证码或提交申请。
          required: true
